name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Project & Compile APK
        run: |
          mkdir -p app/src/main/java/com/example/touchburst
          mkdir -p app/src/main/assets

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://api.xposed.info/" }
              }
          }
          rootProject.name = "TouchBurst"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.touchburst'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.touchburst"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="按住连点模块">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="按住屏幕快速连点+随机微偏移，松手即停，不影响正常触摸" />
                  <meta-data android:name="xposedminversion" android:value="82" />
              </application>
          </manifest>
          EOF

          echo "com.example.touchburst.MainHook" > app/src/main/assets/xposed_init

          cat << 'EOF' > app/src/main/java/com/example/touchburst/MainHook.java
          package com.example.touchburst;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import java.util.Random;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class MainHook implements IXposedHookLoadPackage {
              private static final long HOLD_TRIGGER_MS = 120L;
              private static final float MOVE_SLOP_PX = 15f;
              private static final float OFFSET_RANGE_PX = 6f;
              private static final int MIN_INTERVAL_MS = 38;
              private static final int MAX_INTERVAL_MS = 72;
              private static final int MIN_PRESS_MS = 12;
              private static final int MAX_PRESS_MS = 24;

              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final Random random = new Random();
              private boolean isModuleEnabled = true;

              private boolean isDispatchingSynthetic = false;
              private boolean isBursting = false;
              private boolean isSwiping = false;
              private boolean isSyntheticDown = false;

              private float downX = 0f, downY = 0f;
              private float currentX = 0f, currentY = 0f;
              private float lastSyntheticX = 0f, lastSyntheticY = 0f;
              private Activity currentActivity = null;

              private final Runnable startBurstRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (currentActivity == null || isSwiping || !isModuleEnabled) return;
                      isBursting = true;
                      sendSyntheticEvent(currentActivity, MotionEvent.ACTION_UP, downX, downY);
                      mainHandler.post(burstLoopRunnable);
                  }
              };

              private final Runnable burstLoopRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (!isBursting || currentActivity == null || currentActivity.isFinishing()) return;

                      float offsetX = (random.nextFloat() * 2f - 1f) * OFFSET_RANGE_PX;
                      float offsetY = (random.nextFloat() * 2f - 1f) * OFFSET_RANGE_PX;
                      lastSyntheticX = Math.max(1f, currentX + offsetX);
                      lastSyntheticY = Math.max(1f, currentY + offsetY);

                      isSyntheticDown = true;
                      sendSyntheticEvent(currentActivity, MotionEvent.ACTION_DOWN, lastSyntheticX, lastSyntheticY);

                      int pressDuration = MIN_PRESS_MS + random.nextInt(MAX_PRESS_MS - MIN_PRESS_MS + 1);
                      mainHandler.postDelayed(new Runnable() {
                          @Override
                          public void run() {
                              if (isSyntheticDown && currentActivity != null) {
                                  sendSyntheticEvent(currentActivity, MotionEvent.ACTION_UP, lastSyntheticX, lastSyntheticY);
                                  isSyntheticDown = false;
                              }
                          }
                      }, pressDuration);

                      if (isBursting) {
                          int nextInterval = MIN_INTERVAL_MS + random.nextInt(MAX_INTERVAL_MS - MIN_INTERVAL_MS + 1);
                          mainHandler.postDelayed(this, pressDuration + nextInterval);
                      }
                  }
              };

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if ("android".equals(lpparam.packageName) || lpparam.packageName.startsWith("com.android.systemui")) {
                      return;
                  }

                  XposedHelpers.findAndHookMethod(Activity.class, "onPostCreate", Bundle.class, new XC_MethodHook() {
                      @Override
                      protected void afterHookedMethod(MethodHookParam param) {
                          attachFloatingSwitch((Activity) param.thisObject);
                      }
                  });

                  XposedHelpers.findAndHookMethod(Activity.class, "dispatchTouchEvent", MotionEvent.class, new XC_MethodHook() {
                      @Override
                      protected void beforeHookedMethod(MethodHookParam param) {
                          if (!isModuleEnabled || isDispatchingSynthetic) return;

                          Activity activity = (Activity) param.thisObject;
                          MotionEvent event = (MotionEvent) param.args[0];

                          if (event.getPointerCount() > 1) {
                              stopBurstCleanly(activity);
                              isSwiping = true;
                              return;
                          }

                          int action = event.getActionMasked();
                          if (action == MotionEvent.ACTION_DOWN) {
                              currentActivity = activity;
                              downX = event.getX();
                              downY = event.getY();
                              currentX = downX;
                              currentY = downY;
                              isSwiping = false;
                              isBursting = false;
                              mainHandler.removeCallbacks(startBurstRunnable);
                              mainHandler.postDelayed(startBurstRunnable, HOLD_TRIGGER_MS);
                          } else if (action == MotionEvent.ACTION_MOVE) {
                              currentX = event.getX();
                              currentY = event.getY();
                              if (isBursting) {
                                  param.setResult(true);
                              } else if (!isSwiping) {
                                  double dist = Math.hypot(currentX - downX, currentY - downY);
                                  if (dist > MOVE_SLOP_PX) {
                                      isSwiping = true;
                                      mainHandler.removeCallbacks(startBurstRunnable);
                                  }
                              }
                          } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                              mainHandler.removeCallbacks(startBurstRunnable);
                              if (isBursting) {
                                  stopBurstCleanly(activity);
                                  param.setResult(true);
                              }
                              isSwiping = false;
                          }
                      }
                  });
              }

              private void stopBurstCleanly(Activity activity) {
                  mainHandler.removeCallbacks(startBurstRunnable);
                  mainHandler.removeCallbacks(burstLoopRunnable);
                  if (isSyntheticDown) {
                      sendSyntheticEvent(activity, MotionEvent.ACTION_UP, lastSyntheticX, lastSyntheticY);
                      isSyntheticDown = false;
                  }
                  isBursting = false;
              }

              private void sendSyntheticEvent(Activity activity, int action, float x, float y) {
                  long now = SystemClock.uptimeMillis();
                  MotionEvent event = MotionEvent.obtain(now, now, action, x, y, 0);
                  try {
                      isDispatchingSynthetic = true;
                      activity.dispatchTouchEvent(event);
                  } finally {
                      isDispatchingSynthetic = false;
                      event.recycle();
                  }
              }

              private void attachFloatingSwitch(Activity activity) {
                  if (activity.getWindow() == null) return;
                  View decor = activity.getWindow().getDecorView();
                  if (!(decor instanceof ViewGroup)) return;
                  ViewGroup decorView = (ViewGroup) decor;

                  final TextView button = new TextView(activity);
                  button.setText("连点:开");
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(11f);
                  button.setPadding(24, 12, 24, 12);

                  final GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(40f);
                  bg.setColor(Color.parseColor("#AA1E88E5"));
                  button.setBackground(bg);

                  button.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          isModuleEnabled = !isModuleEnabled;
                          button.setText(isModuleEnabled ? "连点:开" : "连点:关");
                          bg.setColor(Color.parseColor(isModuleEnabled ? "#AA1E88E5" : "#AA757575"));
                      }
                  });

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.gravity = Gravity.TOP | Gravity.END;
                  params.topMargin = 160;
                  params.rightMargin = 32;
                  decorView.addView(button, params);
              }
          }
          EOF

          gradle assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchBurst-APK
          path: app/build/outputs/apk/debug/app-debug.apk
